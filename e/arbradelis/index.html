<!-- Lien court d'entree vers l'editeur.
     Pourquoi il existe : dans un mail, une adresse nue qui porte « ?client=... »
     se fait envelopper par Gmail dans son ecran « Avertissement de redirection ».
     Le restaurateur voit une page d'alerte avant meme d'avoir vu son feed — la
     moitie s'arrete la. Une adresse sans point d'interrogation passe droit.
     Constate le 2026-09-10 sur le lien envoye aux Delices Thai. -->
<title>Votre feed — Food Boost</title>
<meta http-equiv="refresh" content="0;url=/foodboost-editeur/?client=arbradelis&amp;src=mail">
<link rel="canonical" href="/foodboost-editeur/?client=arbradelis">
<style>body{background:#0F1113;color:#EDEFF1;font:400 16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center}
a{color:#FF8A2B}</style></head>
<body><p>Un instant, on ouvre votre feed…<br>
<a href="/foodboost-editeur/?client=arbradelis&amp;src=mail">Ouvrir maintenant</a></p>
<script>location.replace('/foodboost-editeur/?client=arbradelis&src=mail');</script>
</body></html>
