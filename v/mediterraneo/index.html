<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Lien court MESURE vers la page demo.

     Ce qu'il apporte : le clic depuis le mail est enregistre AVANT la
     redirection. Les mails du 10/09 pointaient droit sur /demo-video/<slug>/,
     et le clic n'etait mesure nulle part — on ne savait donc pas distinguer
     « personne n'a ouvert le mail » de « personne n'a clique ».

     CE QU'IL N'APPORTE PAS, contrairement a ce que j'ai d'abord ecrit ici le
     2026-09-24 : il n'empeche pas Gmail d'envelopper l'adresse dans son
     redirecteur google.com/url?q=... Verifie sur capture le meme jour — Gmail
     enveloppe TOUS les liens, avec ou sans point d'interrogation. L'absence
     de parametre reste preferable (adresse courte et lisible dans les clients
     qui n'enveloppent pas), mais ce n'est pas une parade.

     Le slug est ecrit en dur ici, jamais lu dans l'URL : pas de parametre,
     donc rien a assainir. -->
<title>Vos publications — Food Boost</title>
<style>body{background:#0b0b0d;color:#edeff1;font:400 16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center}
a{color:#f0a500}</style></head>
<body><p>Un instant, on ouvre vos publications…<br>
<a id="d" href="/demo-video/mediterraneo/">Ouvrir maintenant</a></p>
<script>
(function(){
  var D='/demo-video/mediterraneo/';
  try{navigator.sendBeacon('https://n7n.automatisationboost.com/webhook/demo-clic',
    new Blob([JSON.stringify({restaurant:'mediterraneo',quoi:'clic-mail',source:'lien-court'})],
    {type:'application/json'}));}catch(e){}
  setTimeout(function(){location.replace(D);},180);
})();
</script></body></html>
